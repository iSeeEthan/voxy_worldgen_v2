modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "CUSTOM"
issueTrackerURL = ""

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''
Optimized passive chunk generation with Voxy integration.
'''
logoFile = "logo.png"

[[mixins]]
config = "voxyworldgenv2.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cloth_config"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "voxy"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
