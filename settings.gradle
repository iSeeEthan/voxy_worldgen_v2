pluginManagement {
    repositories {
        // Fabric (loom)
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        // NeoForged (moddev)
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'voxyworldgenv2'

include 'fabric'
include 'neoforge'
// 'common' is a shared SOURCE directory consumed by each loader module via srcDir,
// not a standalone Gradle subproject, so it is intentionally NOT included here.
